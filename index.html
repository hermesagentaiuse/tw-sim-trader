const cv=document.getElementById('chart'),ctx=cv.getContext('2d');
function draw(){cv.width=cv.clientWidth*2;cv.height=440;ctx.scale(2,2);
 const W=cv.clientWidth,H=220,pad={l:70,r:10,t:10,b:22};
 const all=Object.values(D.curves).flat().map(p=>p.e);
 if(!all.length){ctx.fillStyle='#8b949e';ctx.fillText('尚無淨值資料（等第一次收盤後）',20,100);return;}
 let mn=Math.min(...all,D.initial*.95),mx=Math.max(...all,D.initial*1.05);

 ctx.strokeStyle='#30363d';ctx.fillStyle='#8b949e';ctx.font='10px sans-serif';
 [mn,(mn+mx)/2,mx].forEach(v=>{ctx.beginPath();ctx.moveTo(pad.l,Y(v));ctx.lineTo(W-pad.r,Y(v));ctx.stroke();ctx.fillText(Math.round(v/10000)+'萬',4,Y(v)+3);});

 const colors={MOM:'#58a6ff',MR:'#3fb950',VOL:'#f85149',TRD:'#bc8cff'};
 for(const[k,pts]of Object.entries(D.curves)){if(!pts.length)continue;
  ctx.strokeStyle=colors[k];ctx.lineWidth=2;ctx.beginPath();
  pts.forEach((p,i)=>{i?ctx.lineTo(X(p.d),Y(p.e)):ctx.moveTo(X(p.d),Y(p.e));});ctx.stroke();}
 ctx.fillStyle='#e6edf3';ctx.font='11px sans-serif';let lx=pad.l;
 for(const k of Object.keys(D.labels)){ctx.fillStyle=colors[k];ctx.fillText(k+' '+D.labels[k],lx,12);lx+=ctx.measureText(k+' '+D.labels[k]).width+18;}}
draw();window.addEventListener('resize',()=>{ctx.setTransform(1,0,0,1,0,0);draw();});

 o.pnl==null?'-':`<span class="${o.pnl>=0?'up':'dn'}">${o.pnl>=0?'+':''}${fmt(o.pnl)}</span>`,o.reason||'']));}
function showU(){table(['#','代號','名稱','成交金額(億)','收盤','漲跌'],
