<style>

.sub{color:var(--dim);font-size:12px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}

.sname{font-weight:700}.slabel{color:var(--dim);font-size:12px}
.big{font-size:22px;font-weight:800;margin:6px 0}
.retp{font-size:14px;font-weight:700}.up{color:var(--up)}.dn{color:var(--dn)}
.small{font-size:12px;color:var(--dim)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--dim);text-align:left;font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid #21262d}
canvas{width:100%;height:220px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.tabs{display:flex;gap:8px;margin:10px 0}.tab{padding:6px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:13px}
.tab.on{background:#1f6feb;border-color:#1f6feb}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;background:#30363d}

// 總覽條：四帳戶合計
(function(){
  const totEq=D.stats.reduce((a,s)=>a+s.eq,0), totCash=D.stats.reduce((a,s)=>a+s.cash,0);
  const totPos=D.stats.reduce((a,s)=>a+s.openpos,0), totInit=D.initial*D.stats.length;
  const tRet=(totEq/totInit*100-100);
  const el=document.createElement('div');el.className='card';el.style.gridColumn='1/-1';
  el.innerHTML=`<div class="sname">💰 四帳戶合計（總資金 ${fmt(totInit)}）</div>
  <div class="big">${fmt(totEq)} <span class="retp ${tRet>=0?'up':'dn'}" style="font-size:15px">${tRet>=0?'+':''}${tRet.toFixed(2)}%</span></div>

})();

D.stats.forEach(s=>{
  const el=document.createElement('div');el.className='card'+(s.s===D.leader?' win':'');
  const cls=s.ret>=0?'up':'dn';
  el.innerHTML=`<div class="sname">${s.s} ${s.label} ${s.s===D.leader?'👑':''}</div>

// chart
const cv=document.getElementById('chart'),ctx=cv.getContext('2d');
function draw(){cv.width=cv.clientWidth*2;cv.height=440;ctx.scale(2,2);
 const W=cv.clientWidth,H=220,pad={l:70,r:10,t:10,b:22};
 const all=Object.values(D.curves).flat().map(p=>p.e);
 if(!all.length){ctx.fillStyle='#8b949e';ctx.fillText('尚無淨值資料（等第一次收盤後）',20,100);return;}
 let mn=Math.min(...all,D.initial*.95),mx=Math.max(...all,D.initial*1.05);
 const ds=Object.values(D.curves).flat().map(p=>p.d);const uniq=[...new Set(ds)].sort();
 const X=d=>pad.l+(uniq.indexOf(d)/(uniq.length-1||1))*(W-pad.l-pad.r);
 const Y=e=>pad.t+(1-(e-mn)/(mx-mn))*(H-pad.t-pad.b);
 ctx.strokeStyle='#30363d';ctx.fillStyle='#8b949e';ctx.font='10px sans-serif';
 [mn,(mn+mx)/2,mx].forEach(v=>{ctx.beginPath();ctx.moveTo(pad.l,Y(v));ctx.lineTo(W-pad.r,Y(v));ctx.stroke();ctx.fillText(Math.round(v/10000)+'萬',4,Y(v)+3);});
 ctx.strokeStyle='#e3b34180';ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(pad.l,Y(D.initial));ctx.lineTo(W-pad.r,Y(D.initial));ctx.stroke();ctx.setLineDash([]);
 const colors={MOM:'#58a6ff',MR:'#3fb950',VOL:'#f85149',TRD:'#bc8cff'};
 for(const[k,pts]of Object.entries(D.curves)){if(!pts.length)continue;
  ctx.strokeStyle=colors[k];ctx.lineWidth=2;ctx.beginPath();
  pts.forEach((p,i)=>{i?ctx.lineTo(X(p.d),Y(p.e)):ctx.moveTo(X(p.d),Y(p.e));});ctx.stroke();}
 ctx.fillStyle='#e6edf3';ctx.font='11px sans-serif';let lx=pad.l;
 for(const k of Object.keys(D.labels)){ctx.fillStyle=colors[k];ctx.fillText(k+' '+D.labels[k],lx,12);lx+=ctx.measureText(k+' '+D.labels[k]).width+18;}}
draw();window.addEventListener('resize',()=>{ctx.setTransform(1,0,0,1,0,0);draw();});
const tbl=document.getElementById('tbl');
function table(h,rows){tbl.innerHTML=`<table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>'<tr>'+r.map(x=>`<td>${x}</td>`).join('')+'</tr>').join('')}</table>`;}
function showPos(){table(['策略','代號','名稱','張數','成本','現價','損益%'],
 D.positions.map(p=>{const q=(D.top50.find(t=>t.code===p.code)||{}).close||p.entry_price;
 const pct=p.entry_price?((q-p.entry_price)/p.entry_price*100):0;
 return[`<span class="badge">${p.strategy}</span>`,p.code,p.name,p.qty/1000+'K',fmt(p.cost),fmt(q),`<span class="${pct>=0?'up':'dn'}">${pct>=0?'+':''}${pct.toFixed(1)}%</span>`];})||[]);}
function showPen(){table(['策略','代號','名稱','方向','訊號'],
 D.pending.map(o=>[`<span class="badge">${o.strategy}</span>`,o.code,o.name,o.side==='buy'?'🟢買':'🔴賣',o.reason]));}
function showFil(){table(['日','策略','方向','代號','名稱','數量','價格','損益','原因'],
 D.recent.map(o=>[o.filled_date,`<span class="badge">${o.strategy}</span>`,o.side==='buy'?'買':'賣',o.code,o.name,o.qty/1000+'K',fmt(o.filled_price),
 o.pnl==null?'-':`<span class="${o.pnl>=0?'up':'dn'}">${o.pnl>=0?'+':''}${fmt(o.pnl)}</span>`,o.reason||'']));}
function showU(){table(['#','代號','名稱','成交金額(億)','收盤','漲跌'],
 D.top50.map(t=>[t.rank,t.code,t.name,(t.amount/1e8).toFixed(1),fmt(t.close),t.chg>0?'🔺':t.chg<0?'🔻':'—']));}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');
 ({pos:showPos,pen:showPen,fil:showFil,u:showU})[t.dataset.v]();});
